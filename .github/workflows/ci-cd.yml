name: Construction Website CI

on:
  push:

jobs:

  test-construction-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show files
        run: ls -la

      - name: Check website
        run: test -f index.html

      - name: Build Docker image
        run: docker build -t theharunshaikh/construction-website:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push theharunshaikh/construction-website:latest       
      
      - name: Test SSH connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 ubuntu@${{ secrets.EC2_HOST }} "echo SSH connection successful"    
          
