name: Construction Website CI

on:
  push:

jobs:

  test-construction-website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Show files
        run: ls -la

      - name: Check website
        run: test -f index.html

      - name: Build Docker image
        run: docker build -t theharunshaikh/construction-website:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push theharunshaikh/construction-website:latest       
      
